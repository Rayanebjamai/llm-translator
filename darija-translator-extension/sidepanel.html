<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Darija Translator</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="container">
    <h1>Darija Translator</h1>

    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" value="translator" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" value="translator" />

    <label for="sourceText">Selected Text</label>
    <textarea id="sourceText" placeholder="Selected text will appear here"></textarea>

    <label for="resultText">Result</label>
    <textarea id="resultText" readonly placeholder="Translation will appear here"></textarea>

    <p id="status"></p>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
